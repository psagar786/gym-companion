<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="A visual daily workout companion for Fitness 7 members."><title>Gym Companion V2 — Fitness 7</title><style>
:root{--bg:#101010;--card:#1d1d1d;--line:#393939;--ink:#f8f5ef;--muted:#b8b2aa;--orange:#f45112;--orange-soft:#351d14;--green:#b9d783}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0,#2f211c 0,var(--bg) 33rem);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}.shell{width:min(100%,760px);margin:auto;padding:16px}.logo{width:min(48vw,250px);height:auto}.home-hero{text-align:center;padding:36px 0 22px}.home-hero p{margin:13px 0 3px;font-size:1rem}.home-hero span,.detail-top>span{font-size:.78rem;color:var(--muted)}.home-days{display:grid;gap:9px}.day-card{position:relative;display:grid;grid-template-columns:86px 1fr 24px;gap:8px;align-items:center;min-height:75px;padding:13px;border:1px solid var(--line);border-radius:15px;background:linear-gradient(135deg,#242424,#171717);color:var(--ink);text-align:left;cursor:pointer}.day-card:hover,.day-card:focus-visible{border-color:var(--orange)}.day-card b{font-size:.9rem;color:#ffaf8b}.day-card span{font-size:1rem;font-weight:750}.day-card small{grid-column:2;color:var(--muted);font-size:.74rem}.day-card i{grid-column:3;grid-row:1/3;color:#ff9b74;font-size:1.5rem;font-style:normal}.rest-card{background:#181818}.device-note{text-align:center;color:var(--muted);font-size:.75rem;margin:20px 0}.detail-top{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:70px}.detail-top .logo{width:min(32vw,150px)}.detail-top>span{text-align:right}.back-link{border:0;background:transparent;color:#ffad8c;font:inherit;font-size:.84rem;font-weight:800;padding:8px 0;text-align:left;cursor:pointer}.head{margin:17px 0 12px}.eyebrow{display:block;color:#ff9b74;text-transform:uppercase;letter-spacing:.11em;font-size:.7rem;font-weight:800}.head h1,.history-summary h1,.rest-card h1{margin:4px 0;font-size:clamp(2rem,9vw,3rem);line-height:1}.tag{display:inline-block;margin-top:8px;padding:5px 9px;border-radius:99px;background:#412517;color:#ffae8c;font-size:.76rem}.card{background:linear-g y-summary>p{color:var(--muted);font-size:.82rem}.history-summary #slots{margin-top:14px}.utility{display:flex;gap:8px;margin:18px 0}.utility .button{flex:1}.rest-card{padding:22px;margin-top:45px}.rest-card p{color:var(--muted)}@media(min-width:700px){.home-days{grid-template-columns:1fr 1fr}.day-card:last-child{grid-column:1/3}.guided-list{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.guided-step{grid-template-columns:64px minmax(0,1fr) auto}.guided-image{width:64px}.selected-exercise{grid-template-columns:160px 1fr}}@media(max-width:380px){.shell{padding:12px}.day-card{grid-template-columns:76px 1fr 20px}.guided-step{grid-template-columns:62px minmax(0,1fr) auto}.guided-image{width:62px}.selected-exercise{grid-template-columns:108px 1fr}.detail-top .logo{width:110px}.guided-step p{font-size:.69rem}.pill{font-size:.66rem;padding:6px}}@media print{body{background:#fff;color:#111}.home-screen,.detail-top,.calendar,.utility,.check,.option-pills,.guided-choices{display:none!important}.card{background:#fff;border-color:#aaa}.phase{display:block}.guided-list{display:block}.guided-step{display:block}.guided-image,.visual{display:none}.selected-exercise{grid-template-columns:1fr;background:#fff}}
