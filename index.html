<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#101010"><meta name="description" content="A visual daily workout companion for Fitness 7 members."><title>Gym Companion V2 — Guided Workout</title><style>
:root{--bg:#101010;--card:#1b1b1b;--line:#343434;--ink:#f8f5ef;--muted:#b8b2aa;--orange:#f45112;--orange-soft:#321c14}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0,#2d211d 0,var(--bg) 34rem);color:var(--ink);font:16px/1.45 Inter,system-ui,sans-serif}.shell{max-width:1080px;margin:auto;padding:16px}.hero{position:relative;display:flex;justify-content:center;min-height:132px;align-items:center}.logo{width:min(64vw,370px);height:auto}.date{position:absolute;right:0;top:8px;color:#ff9b74;font-size:.75rem;text-align:right}.date small{display:block;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}.days{display:flex;gap:7px;overflow-x:auto;scroll-snap-type:x mandatory;padding:5px 0 14px}.day{min-width:82px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;background:#181818;color:var(--ink);padding:9px 8px;text-align:left;cursor:pointer}.day small{display:block;color:var(--muted);font-size:.64rem;line-height:1.2;margin-top:2px}.day.active{border-color:var(--orange);background:#291914}.layout{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:16px}.eyebrow{color:#ff9b74;text-transform:uppercase;letter-spacing:.12em;font-size:.7rem;font-weight:800}.head h1{margin:3px 0;font-size:clamp(2rem,5vw,3rem);line-height:1}.tag{display:inline-block;margin-top:8px;border-radius:99px;background:#412517;color:#ffae8c;padding:5px 9px;font-size:.76rem}.card{background:linear-gradient(145deg,#202020,#171717);border:1px solid var(--line);border-radius:15px}.phase,.workout-slot{margin:11px 0;overflow:hidden}.phase-head{display:flex;justify-content:space-between;align-items:center;width:100%;padding:13px;border:0;background:transparent;color:var(--ink);cursor:pointer;text-align:left}.phase-head b{display:block;font-size:.8rem;letter-spacing:.1em;text-transform:uppercase;color:#ff9b74}.phase-head small{display:block;color:var(--muted);font-size:.78rem;margin-top:2px}.phase-body{border-top:1px solid var(--line);padding:5px 12px 12px}.step{display:grid;grid-template-columns:22px 1fr auto;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #2b2b2b}.step:last-child{border:0}.step input,.slot-head input{width:20px;height:20px;accent-color:var(--orange)}.step b{display:block;font-size:.86rem}.step small{display:block;color:var(--muted);font-size:.74rem}.step.done b{text-decoration:line-through;color:var(--muted)}.timer-btn,.pill,.button{border:1px solid var(--line);border-radius:9px;background:#272727;color:var(--ink);padding:7px 9px;font:inherit;font-size:.74rem;font-weight:700;cursor:pointer}.timer-btn{color:#ff9b74}.slot-head{display:grid;grid-template-columns:31px 1fr 22px;gap:10px;align-items:center;padding:12px}.num{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:#33231d;color:#ff9b74;font-weight:800;font-size:.75rem}.slot-head b{display:block}.slot-head small{display:block;color:var(--muted);font-size:.75rem}.option-pills{display:flex;gap:7px;padding:0 12px 11px;overflow-x:auto}.pill{white-space:nowrap}.pill.selected{background:var(--orange-soft);border-color:var(--orange);color:#ffad8c}.selected-exercise{display:grid;grid-template-columns:160px 1fr;gap:12px;padding:12px;border-top:1px solid var(--line);background:#151515}.visual{width:100%;aspect-ratio:1;border-radius:10px;background:#101010 center/contain no-repeat}.selected-exercise h2{font-size:1.04rem;margin:4px 0}.selected-exercise p{color:var(--muted);font-size:.85rem;margin:6px 0}.selected-exercise span{font-size:.77rem;color:#ff9b74}.side{position:sticky;top:12px;height:max-content}.side .card{padding:14px;margin:10px 0}.side p{color:var(--muted);font-size:.82rem;margin:6px 0}.progress{height:7px;background:#3b3b3b;border-radius:99px;overflow:hidden;margin-top:10px}.progress i{display:block;height:100%;background:var(--orange);width:0;transition:width .2s}.button{width:100%;margin-top:8px;padding:10px}.notice{font-size:.74rem;color:var(--muted);padding:0 3px}.timer{position:fixed;z-index:2;left:50%;bottom:15px;transform:translateX(-50%);display:flex;gap:10px;align-items:center;max-width:calc(100vw - 24px);padding:10px 12px;border:1px solid var(--orange);border-radius:13px;background:#24150f;box-shadow:0 12px 32px #0009}.timer small{display:block;color:#ffad8c}.timer strong{font-variant-numeric:tabular-nums;font-size:1.2rem}.timer .button{width:auto;margin:0;padding:7px 10px}@media(max-width:760px){.layout{grid-template-columns:1fr}.side{position:static;display:grid;grid-template-columns:1fr 1fr;gap:10px}.side .card{margin:0}}@media(max-width:500px){.shell{padding:12px}.hero{min-height:112px}.logo{width:min(69vw,315px)}.date{top:1px}.selected-exercise{grid-template-columns:112px 1fr;gap:10px}.selected-exercise h2{font-size:.95rem}.selected-exercise p{font-size:.78rem}.step{grid-template-columns:22px 1fr}.timer-btn{grid-column:2;justify-self:start}.side{grid-template-columns:1fr}.day{min-width:75px}.days{margin-inline:-2px}.option-pills{padding-bottom:10px}}@media print{body{background:#fff;color:#111}.days,.side,.date,.timer,.timer-btn,.option-pills{display:none!important}.card{background:#fff;border-color:#aaa}.selected-exercise{grid-template-columns:1fr;background:#fff}.visual{display:none}.phase-body{display:block!important}}
</style></head><body><main class="shell"><header class="hero"><img class="logo" src="assets/fitness7-hero-logo.png" alt="Fitness 7"><div class="date"><small>Training date</small><span id="date"></span></div></header><nav id="days" class="days" aria-label="Training days"></nav><section class="layout"><div><header id="head" class="head"></header><div id="guided"></div><div id="slots"></div><div id="finish"></div></div><aside class="side"><section class="card"><b>Session progress</b><p id="score"></p><div class="progress"><i id="bar"></i></div></section><section class="card"><b>Trainer rule</b><p>Move with control. Zone 2 means you can speak in short sentences. Stop for sharp pain, dizziness, chest symptoms, or unusual breathlessness.</p><button class="button" id="print">Print today</button><button class="button" id="reset">Reset V2 tracker</button></section><p class="notice">V2 stores choices, checkmarks, and timers only on this device.</p></aside></section></main><aside class="timer" id="timer" hidden><div><small id="timerLabel"></small><strong id="timerValue">00:00</strong></div><button class="button" id="stopTimer">Stop</button></aside><script src="data/routine.js"></script><script src="app.js"></script></body></html>
